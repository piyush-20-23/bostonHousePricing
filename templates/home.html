<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boston House Price Prediction</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Pacifico|Arimo|Open+Sans:300,400,600" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: "Open Sans", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px 35px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-family: "Pacifico", cursive;
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        form input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        form input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        button {
            grid-column: 1 / -1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .prediction {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        @media (max-width: 600px) {
            form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Boston House Price Prediction</h1>

        <form action="{{ url_for('predict') }}" method="post">
            <input type="text" name="CRIM" placeholder="CRIM" required>
            <input type="text" name="ZN" placeholder="ZN" required>

            <input type="text" name="INDUS" placeholder="INDUS" required>
            <input type="text" name="CHAS" placeholder="CHAS" required>

            <input type="text" name="NOX" placeholder="NOX" required>
            <input type="text" name="RM" placeholder="RM" required>

            <input type="text" name="Age" placeholder="AGE" required>
            <input type="text" name="DIS" placeholder="DIS" required>

            <input type="text" name="RAD" placeholder="RAD" required>
            <input type="text" name="TAX" placeholder="TAX" required>

            <input type="text" name="PTRATIO" placeholder="PTRATIO" required>
            <input type="text" name="B" placeholder="B" required>

            <input type="text" name="LSTAT" placeholder="LSTAT" required class="full-width">

            <button type="submit">Predict Price</button>
        </form>

        {% if prediction_text %}
            <div class="prediction">
                {{ prediction_text }}
            </div>
        {% endif %}
    </div>
</body>
</html>
